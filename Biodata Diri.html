<html lang="id"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Diri</title>
    <style>
        :root {
            --bg: #e8eef2;
            --card: #ffffff;
            --ink: #152029;
            --muted: #7f97aa;
            --accent: #388faf;
            --line: #c6d7e4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .biodata {
            background: var(--card);
            width: 100%;
            max-width: 720px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(52, 72, 87, 0.12);
        }

        .header {
            display: flex;
            gap: 24px;
            align-items: center;
            background: var(--accent);
            color: #b38787;
            padding: 32px;
        }

        .header img {
            width: 140px;
            height: 180px;
            object-fit: cover;
            border: 4px solid #380f0f;
            border-radius: 4px;
            background: #a6bbc9;
        }

        .header h1 {
            font-size: 1.9rem;
            line-height: 1.2;
        }

        .header p {
            margin-top: 8px;
            font-style: italic;
            opacity: .92;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 14px 32px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        th {
            width: 35%;
            color: var(--muted);
            font-weight: normal;
        }

        tr:last-child th,
        tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 520px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            th,
            td {
                padding: 12px 20px;
                display: block;
                width: 100%;
            }

            th {
                border-bottom: none;
                padding-bottom: 0;
            }
        }
    </style>
</head>
